name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stateflow
          POSTGRES_PASSWORD: stateflow
          POSTGRES_DB: stateflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stateflow -d stateflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://stateflow:stateflow@localhost:5432/stateflow_test
      TEST_DATABASE_URL: postgresql://stateflow:stateflow@localhost:5432/stateflow_test
      BETTER_AUTH_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PUBLIC_REGISTRATION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
